name: Build recovery preview
on:
  workflow_dispatch:
  push:
    branches: ['master', 'codex/client-features']
    paths: ['recovery/**', '.github/workflows/recovery-preview.yml']
  pull_request:
    paths: ['recovery/**', '.github/workflows/recovery-preview.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build application and run protocol tests
        shell: pwsh
        run: ./recovery/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: BeipMU-Recovery-0.8-x64
          path: recovery/dist/BeipMU-Recovery-0.8-x64.zip
